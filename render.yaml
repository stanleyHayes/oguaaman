# Render Blueprint — Oguaa API (paid instance, 0.5 CPU / 512 MB).
# Deploy: Render dashboard → New → Blueprint → pick this repo. Render reads this
# file, builds backend/Dockerfile, and prompts for the sync:false secrets once.
#
# Notes:
# - Paid instances don't sleep, so Paystack callbacks, webhooks and the payment
#   reconciliation sweep run without cold-start delays.
# - The disk is ephemeral — files under UPLOAD_DIR vanish on redeploy/restart.
#   Durable member images go through Cloudinary (signed uploads: set the
#   CLOUDINARY_* keys below); first-party /uploads are best-effort.
# - Only $PORT is exposed publicly, so the gRPC server (50051) stays internal.
#   Clients use the REST API (/api/*); GraphQL is off in production unless
#   GRAPHQL_ENABLED=true.
services:
  - type: web
    name: oguaa-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # 0.5c-512mb = 0.5 CPU / 512 MB, the smallest paid instance (the tier
    # directly above free). Render's Blueprint plan names are compute-based —
    # see render.com/docs/blueprint-spec.
    plan: 0.5c-512mb
    region: frankfurt # closest Render region to Ghana
    healthCheckPath: /api/health
    envVars:
      # Go's soft memory limit, read by the Go runtime itself (no code reads
      # it). As the heap nears 400 MiB the garbage collector works harder
      # instead of letting a burst (cover renders, big exports) grow the heap
      # until the 512 MB instance is killed; the rest is headroom for stacks,
      # buffers and the runtime.
      - key: GOMEMLIMIT
        value: 400MiB
      # Atlas M0 (free) connection string — paste the mongodb+srv:// URI from
      # Atlas → Database → Connect → Drivers. The live cluster is already seeded.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: oguaa
      # Apple In-App Purchase (Guideline 3.1.1). IAP is disabled until the
      # bundle id is set; sandbox (App Review) purchases are accepted, flagged
      # and limited to 24 h. Keep APPLE_ALLOW_SANDBOX false in production.
      - key: APPLE_BUNDLE_ID
        sync: false
      - key: APPLE_ALLOW_SANDBOX
        value: "false"
      # Render generates a strong secret on first deploy.
      - key: JWT_SECRET
        generateValue: true
      # Encrypts members' TOTP (2FA) secrets at rest with AES-GCM. Render
      # generates it once; the AES key is derived from it via SHA-256. Do not
      # rotate casually — changing it makes existing enrolled 2FA unverifiable
      # (users would re-enroll). Absent => secrets stored plaintext (not advised).
      - key: MFA_ENC_KEY
        generateValue: true
      # Turns on the backend's production safety validation (JWT/CORS/
      # PUBLIC_API_URL must be real, not dev defaults). Fails fast on misconfig.
      - key: GO_ENV
        value: production
      # Enforce real sign-in on writes/admin in production.
      - key: AUTH_REQUIRED
        value: "true"
      # Every Vercel frontend that calls the API, comma-separated (CORS). Add a
      # custom domain here later. Keep in sync with the deployed Vercel URLs:
      #   marketing https://oguaaman.com · citizen/portal https://citizen.oguaaman.com
      #   admin/steward https://admin.oguaaman.com · creator https://creator.oguaaman.com
      - key: ALLOWED_ORIGIN
        value: https://oguaaman.com,https://www.oguaaman.com,https://citizen.oguaaman.com,https://creator.oguaaman.com,https://admin.oguaaman.com
      # The citizen web app (portal) — where payers return after Paystack checkout.
      - key: PUBLIC_PORTAL_URL
        value: https://citizen.oguaaman.com
      # The creator studio. Without this, creator-facing links fall back to
      # PUBLIC_PORTAL_URL and send creators to the citizen portal instead.
      - key: PUBLIC_CREATOR_URL
        value: https://creator.oguaaman.com
      # Absolute base for returned image URLs.
      - key: PUBLIC_API_URL
        value: https://api.oguaaman.com
      - key: UPLOAD_DIR
        value: /app/uploads
      # ── Cloudinary signed uploads (optional) ──
      # When all three are set, clients get per-upload signatures from
      # POST /api/uploads/cloudinary-signature and the unsigned upload preset
      # can be disabled in the Cloudinary console. Blank => signed uploads are
      # unavailable and clients use first-party POST /api/uploads.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PLATFORM_FEE_PERCENT
        value: "5"
      # ── AI writing assistant: Anthropic is PRIMARY; Kimi is the backup ──
      # Set ANTHROPIC_API_KEY in the Render dashboard. In production a blank
      # key means the AI endpoints answer 503 ai_unavailable (never a
      # simulation); the server still starts and logs an ERROR.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Claude model for the assistant. Haiku 4.5 is the cheapest tier and is
      # plenty for rewrite/summarise/retitle; swap to claude-sonnet-5 or
      # claude-opus-5 if writing quality matters more than cost. Set here (not
      # only in code) so the model can change without a redeploy.
      - key: OGUAA_AI_MODEL
        value: claude-haiku-4-5-20251001
      # Spend guards: global calls/day, and per-member calls/day.
      - key: OGUAA_AI_DAILY_BUDGET
        value: "60"
      - key: OGUAA_AI_PER_MEMBER
        value: "20"
      # Kimi (Moonshot AI, China) — resilience backup, used only if Anthropic
      # is absent or errors. It is OFF in production unless AI_ALLOW_KIMI is
      # "true": enable it only once the transfer is contracted and named in
      # the privacy notice. Leave KIMI_API_KEY blank to run Anthropic-only.
      - key: AI_ALLOW_KIMI
        value: "false"
      - key: KIMI_API_KEY
        sync: false
      - key: KIMI_MODEL
        value: k3 # Kimi K3
      - key: KIMI_BASE_URL
        value: https://api.moonshot.ai/v1

      # ── Automated research desk — trusted RSS/Atom sources only ──
      # Semicolon-separated `name|https-url` entries. Edit this Blueprint value
      # and sync Render whenever the trusted publisher list changes. Only a short
      # (<= 60-word) summary, the source, its author and a link to the full story
      # are stored. Items from a feed marked "all rights reserved" are skipped
      # unless the entry carries a third field recording the licence or written
      # permission to republish: `name|https-url|licence-reference`.
      - key: AUTO_NEWS_FEEDS
        # Defaults cover two Ghana newsrooms plus a Cape Coast-specific Google
        # News discovery feed. The backend still applies its local relevance
        # filter and deduplicates the same story across sources.
        value: 'MyJoyOnline|https://www.myjoyonline.com/feed/;3News Ghana|https://3news.com/feed.xml;Google News Cape Coast|https://news.google.com/rss/search?q=%22Cape%20Coast%22&hl=en-GH&gl=GH&ceid=GH:en'
      # Official alert feeds additionally require the verified authority:
      # name|https-url|orgId|orgSlug|orgName. Keep blank until that authority
      # exists and is verified in Oguaa. Example after GMet is created:
      # Ghana Meteorological Agency|https://www.meteo.gov.gh/api/cap/rss.xml|inst-gmet|ghana-meteorological-agency|Ghana Meteorological Agency
      - key: AUTO_ALERT_FEEDS
        value: ""
      - key: AUTO_RESEARCH_INTERVAL_MINUTES
        value: "30"

      # ── Researched news desk (long-form reports) ──
      # Uses ANTHROPIC_API_KEY above; without it the research worker never
      # starts and the RSS briefs carry on as before. Long-form research and AI
      # covers are OFF until a steward turns them on in Admin → Settings → News
      # desk, and every AI-written report waits for an editor (never
      # auto-published). The Kimi backup is never used for news.
      - key: OGUAA_NEWS_MODEL
        value: claude-opus-5-5
      # Call 2 (structuring). Try claude-sonnet-5-5 later to save cost.
      - key: OGUAA_NEWS_STRUCTURE_MODEL
        value: claude-opus-5-5
      # low | medium | high
      - key: OGUAA_NEWS_EFFORT
        value: medium
      - key: OGUAA_NEWS_MAX_SEARCHES
        value: "5"
      - key: OGUAA_NEWS_MAX_FETCHES
        value: "4"
      - key: OGUAA_NEWS_MAX_CONTINUATIONS
        value: "3"
      # Hosts (no scheme, comma-separated) web search and fetch may read, on
      # top of the AUTO_NEWS_FEEDS hosts. Read once at startup.
      - key: OGUAA_NEWS_ALLOWED_DOMAINS
        value: gna.org.gh,graphic.com.gh,myjoyonline.com,citinewsroom.com,3news.com,gbcghanaonline.com,gov.gh,ucc.edu.gh,ec.gov.gh,ghanahealthservice.org,police.gov.gh
      # OpenAI image generation for report covers. Blank => every report gets
      # the branded Oguaa Newsroom cover (needs no key). Covers also need the
      # CLOUDINARY_* keys above.
      - key: OPENAI_API_KEY
        sync: false
      # Pinned snapshot, never an alias.
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2.5-flare-2026-09-08
      - key: OPENAI_IMAGE_QUALITY
        value: medium

      # ── Paid advertising ──
      # Signs the tokens that make ad views and clicks billable. Generate once:
      # `openssl rand -base64 32`. Blank => every ad slot stays empty (a
      # warning is logged at startup). Rotating it only invalidates tokens
      # issued in the last 15 minutes. Ads are also OFF until a steward turns
      # them on in Admin → Settings → Ads. Ad payments use PAYSTACK_SECRET_KEY
      # below, and ad creatives need the CLOUDINARY_* keys above.
      - key: ADS_TOKEN_SECRET
        sync: false

      # ── Payments — required for paid flows. Production never simulates:
      # blank => every paid start/confirm answers 503 payments_unavailable and
      # the server logs an ERROR at startup (it still starts). ──
      # PAYSTACK_SECRET_KEY: the LIVE secret key (sk_live_…), set in the Render
      # dashboard only — never commit it. The same key also verifies webhook
      # signatures (HMAC-SHA512), so no separate webhook secret exists. An
      # sk_test_ key in production logs an ERROR at startup. No Paystack public
      # key is needed anywhere.
      # The key may be shared with other apps on the same Paystack account:
      # Oguaa sends its own callback_url on every transaction, prefixes its
      # references with "oguaa-", tags them metadata.app="oguaa", ignores other
      # apps' webhook events, and re-checks its own pending payments every 10
      # minutes — so it needs neither the dashboard callback URL nor the
      # account webhook. Point the Live webhook at
      # https://api.oguaaman.com/api/payments/paystack/webhook only if no other
      # app relies on it (it makes confirmations instant instead of ≤10 min).
      - key: PAYSTACK_SECRET_KEY
        sync: false
      # STRIPE_SECRET_KEY: leave BLANK. Setting it enables Stripe mobile
      # checkout, which would sell plans and promotions in the apps.
      - key: STRIPE_SECRET_KEY
        sync: false

      # ── Transactional email (Resend) — password-reset codes, OTPs, notices ──
      # Blank => email is skipped (in-app notices still work) and email codes
      # cannot be delivered: production answers 503 instead (it never returns a
      # code in the response). Set it so verification and reset codes arrive.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Oguaa <noreply@oguaaman.com> # must be a Resend-verified domain

      # ── WhatsApp OTP (Meta WhatsApp Business Cloud API) — optional ──
      # Blank => no codes to phone numbers: production answers 503 for
      # phone-only accounts (codes are never returned in the response).
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      # Optional: name of an approved WhatsApp *authentication* template (one
      # body placeholder for the code + the copy-code button). Meta delivers
      # business-initiated messages outside the 24-hour window only through
      # templates. Blank => codes go as free-form text (inside the window only).
      - key: WHATSAPP_OTP_TEMPLATE
        sync: false
      # Optional: the template's language code (default "en").
      - key: WHATSAPP_TEMPLATE_LANG
        value: en

      # ── Web Push (VAPID) — browser safety-alert push (the "ring") ──
      # Generate once: `npx web-push generate-vapid-keys`. Blank => browsers can't
      # subscribe and the ring stays in-app/foreground; Expo (mobile) needs no key.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:hello@oguaaman.com
