# Render Blueprint — Oguaa API (free tier).
# Deploy: Render dashboard → New → Blueprint → pick this repo. Render reads this
# file, builds backend/Dockerfile, and prompts for the sync:false secrets once.
#
# Free-tier notes:
# - The service sleeps after ~15 min idle; first request after a nap takes ~50s.
# - The disk is ephemeral — files under UPLOAD_DIR vanish on redeploy/restart.
#   Durable member images go through Cloudinary (unsigned preset, see
#   frontend/.env.example); first-party /uploads are best-effort on free.
# - Only $PORT is exposed publicly, so the gRPC server (50051) stays internal.
#   The portal talks REST (/api/*) + GraphQL (/graphql) only.
services:
  - type: web
    name: oguaa-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt # closest Render region to Ghana
    healthCheckPath: /api/health
    envVars:
      # Atlas M0 (free) connection string — paste the mongodb+srv:// URI from
      # Atlas → Database → Connect → Drivers. The live cluster is already seeded.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: oguaa
      # Apple In-App Purchase (Guideline 3.1.1). IAP is disabled until the
      # bundle id is set; sandbox receipts are never accepted in production.
      - key: APPLE_BUNDLE_ID
        sync: false
      - key: APPLE_ALLOW_SANDBOX
        value: "false"
      # Render generates a strong secret on first deploy.
      - key: JWT_SECRET
        generateValue: true
      # Encrypts members' TOTP (2FA) secrets at rest with AES-GCM. Render
      # generates it once; the AES key is derived from it via SHA-256. Do not
      # rotate casually — changing it makes existing enrolled 2FA unverifiable
      # (users would re-enroll). Absent => secrets stored plaintext (not advised).
      - key: MFA_ENC_KEY
        generateValue: true
      # Turns on the backend's production safety validation (JWT/CORS/
      # PUBLIC_API_URL must be real, not dev defaults). Fails fast on misconfig.
      - key: GO_ENV
        value: production
      # Enforce real sign-in on writes/admin in production.
      - key: AUTH_REQUIRED
        value: "true"
      # Every Vercel frontend that calls the API, comma-separated (CORS). Add a
      # custom domain here later. Keep in sync with the deployed Vercel URLs:
      #   marketing https://oguaaman.com · citizen/portal https://citizen.oguaaman.com
      #   admin/steward https://admin.oguaaman.com · creator https://creator.oguaaman.com
      - key: ALLOWED_ORIGIN
        value: https://oguaaman.com,https://www.oguaaman.com,https://citizen.oguaaman.com,https://creator.oguaaman.com,https://admin.oguaaman.com
      # The citizen web app (portal) — where payers return after Paystack checkout.
      - key: PUBLIC_PORTAL_URL
        value: https://citizen.oguaaman.com
      # The creator studio. Without this, creator-facing links fall back to
      # PUBLIC_PORTAL_URL and send creators to the citizen portal instead.
      - key: PUBLIC_CREATOR_URL
        value: https://creator.oguaaman.com
      # Absolute base for returned image URLs.
      - key: PUBLIC_API_URL
        value: https://api.oguaaman.com
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: PLATFORM_FEE_PERCENT
        value: "5"
      # ── AI writing assistant: Anthropic is PRIMARY; Kimi is the backup ──
      # Set ANTHROPIC_API_KEY in the Render dashboard. If it is blank the
      # assistant silently falls through to Kimi, and then to a labelled
      # simulation — it never errors, so a missing key is easy to miss.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Claude model for the assistant. Haiku 4.5 is the cheapest tier and is
      # plenty for rewrite/summarise/retitle; swap to claude-sonnet-5 or
      # claude-opus-5 if writing quality matters more than cost. Set here (not
      # only in code) so the model can change without a redeploy.
      - key: OGUAA_AI_MODEL
        value: claude-haiku-4-5-20251001
      # Spend guards: global calls/day, and per-member calls/day.
      - key: OGUAA_AI_DAILY_BUDGET
        value: "60"
      - key: OGUAA_AI_PER_MEMBER
        value: "20"
      # Kimi (Moonshot) — resilience backup, used only if Anthropic is absent
      # or errors. Leave KIMI_API_KEY blank to run Anthropic-only.
      - key: KIMI_API_KEY
        sync: false
      - key: KIMI_MODEL
        value: k3 # Kimi K3
      - key: KIMI_BASE_URL
        value: https://api.moonshot.ai/v1

      # ── Payments — blank => pledge/escrow runs a labelled simulation ──
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY # optional — Stripe mobile checkout
        sync: false

      # ── Transactional email (Resend) — password-reset codes, OTPs, notices ──
      # Blank => email is skipped (in-app notices still work). Recommended in
      # production so reset/OTP codes are delivered, not returned in the response.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Oguaa <noreply@oguaaman.com> # must be a Resend-verified domain

      # ── WhatsApp OTP (Meta WhatsApp Business Cloud API) — optional ──
      # Blank => phone-verification OTP is returned in the API response (dev only).
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false

      # ── Web Push (VAPID) — browser safety-alert push (the "ring") ──
      # Generate once: `npx web-push generate-vapid-keys`. Blank => browsers can't
      # subscribe and the ring stays in-app/foreground; Expo (mobile) needs no key.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:hello@oguaaman.com
