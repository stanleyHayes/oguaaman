<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123F2D" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#05150e" media="(prefers-color-scheme: dark)" />

    <!-- Resolve the theme before first paint (no flash): stored choice wins,
         else the OS preference. Mirrors the client portal (oguaa.theme key). -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("oguaa.theme");
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) {}
      })();
    </script>

    <!-- Everything between these markers is generated per route at build time
         from src/seo/routes.ts + src/seo/site.ts — title, description,
         keywords, canonical, Open Graph, Twitter and the JSON-LD entity graph
         that tells search engines Oguaa, Oguaaman, Obama City and Cape Coast
         are one place. Do not hand-edit; see plugins/seo-prerender.ts. -->
    <!--seo:start-->
    <!--seo:end-->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=JetBrains+Mono:wght@500&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!--seo:shell-start--><!--seo:shell-end-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
